name: Validate experiment archives

on:
  pull_request:
    paths:
      - "campaigns/**"
      - ".github/workflows/validate-archives.yml"
  push:
    branches: [main]
    paths:
      - "campaigns/**"
      - ".github/workflows/validate-archives.yml"

permissions:
  contents: read

jobs:
  qwen36-h100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python campaigns/qwen36-h100/validate_archive.py
